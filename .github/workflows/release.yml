name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check embedded extensions are in sync
        run: |
          sh scripts/sync-embedded-extensions.sh
          if [ -n "$(git status --porcelain -- relay/embedded)" ]; then
            echo "relay/embedded is stale; run scripts/sync-embedded-extensions.sh and commit" >&2
            git --no-pager diff --stat -- relay/embedded >&2
            exit 1
          fi


      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: "UI packs: no generated windows committed"
        run: sh scripts/check-ui-packs.sh

      - name: "Docs: EN/ZH twins, switchers, links"
        run: python3 scripts/check-docs-i18n.py

      - name: "Plan extension: command policy"
        run: sh scripts/test-plan-policy.sh

      - name: "Embedded extensions: Go syntax"
        run: sh scripts/check-embedded-go.sh

      - name: Unit tests (versions, pure helpers)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build relay (android/arm64)
        run: |
          cd relay
          go vet ./...
          go test ./...
          go test -race ./...
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="dev-${GITHUB_SHA::7}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "relay buildVersion=$VERSION_NAME"
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w -X main.buildVersion=$VERSION_NAME" \
            -o "$GITHUB_WORKSPACE/pig-relay-android-arm64" .

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pig-release.p12"

      - name: Build signed release
        env:
          PIG_RELEASE_STORE_FILE: ${{ runner.temp }}/pig-release.p12
          PIG_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          PIG_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PIG_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="dev-${GITHUB_SHA::7}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_CODE=$(git rev-list --count HEAD)
          else
            VERSION_CODE=$(sh scripts/version-code.sh "$GITHUB_REF_NAME")
          fi
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify APK signer and version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            WANT="${GITHUB_REF_NAME#v}"
            echo "$BADGING" | grep -q "versionName='$WANT'" || {
              echo "APK versionName does not match tag $WANT" >&2
              exit 1
            }
          fi
          sha256sum "$APK" > "$APK.sha256"
          sha256sum pig-relay-android-arm64 > pig-relay-android-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pig-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pig-relay-android-arm64
          path: |
            pig-relay-android-arm64
            pig-relay-android-arm64.sha256
          if-no-files-found: error

      # A curated summary per release: release-notes/<tag>.md is prepended to
      # the generated "What's Changed" list. The file is optional.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          body="$RUNNER_TEMP/release-body.md"
          if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then
            cp "release-notes/$GITHUB_REF_NAME.md" "$body"
            echo "release notes: release-notes/$GITHUB_REF_NAME.md ($(wc -c < "$body") bytes)"
          else
            printf '## %s\n' "$GITHUB_REF_NAME" > "$body"
            echo "release notes: generated list only"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Every tag build is a preview: the project ships often, and the
          # "latest" slot stays on the last release the user deemed stable.
          prerelease: true
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            pig-relay-android-arm64
            pig-relay-android-arm64.sha256
            scripts/install-termux.sh
            scripts/enable-external-apps.sh
          generate_release_notes: true
