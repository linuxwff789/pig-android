name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Check bundled packs are in sync
        run: |
          sh scripts/sync-bundled-packs.sh
          if [ -n "$(git status --porcelain -- app/src/main/assets)" ]; then
            echo "app/src/main/assets is stale; run scripts/sync-bundled-packs.sh and commit" >&2
            git --no-pager diff --stat -- app/src/main/assets >&2
            exit 1
          fi

      - name: Build relay (android/arm64)
        run: |
          cd relay
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/pig-relay-android-arm64" .

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pig-release.p12"

      - name: Build signed release
        env:
          PIG_RELEASE_STORE_FILE: ${{ runner.temp }}/pig-release.p12
          PIG_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          PIG_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PIG_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="dev-${GITHUB_SHA::7}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: pig-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pig-relay-android-arm64
          path: pig-relay-android-arm64
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            pig-relay-android-arm64
            scripts/install-termux.sh
          generate_release_notes: true
