name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every doc has an English + 简体中文 twin, both carry the language
      # switcher, and no relative link or in-page anchor is dead.
      - name: "Docs: EN/ZH twins, switchers, links"
        run: python3 scripts/check-docs-i18n.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check embedded extensions are in sync
        run: |
          sh scripts/sync-embedded-extensions.sh
          if [ -n "$(git status --porcelain -- relay/embedded)" ]; then
            echo "relay/embedded is stale; run scripts/sync-embedded-extensions.sh and commit" >&2
            git --no-pager diff --stat -- relay/embedded >&2
            exit 1
          fi


      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      # The relay ships with every release; catch a broken build (or a failing
      # history/page test) on the PR instead of at tag time.
      - name: "Relay: vet, test, cross-compile"
        run: |
          cd relay
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w -X main.buildVersion=dev-${GITHUB_SHA::7}" \
            -o "$RUNNER_TEMP/pig-relay-android-arm64" .

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as check-run annotations: the job log is
            # not readable without admin rights, annotations are.
            grep -E "^e: " "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do
              echo "::error::${line#e: }"
            done
            grep -A 6 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -24 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          tail -40 "$RUNNER_TEMP/gradle.log"
          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: pig-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease -PversionCode=100 -PversionName=1.0.0 --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pig-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
