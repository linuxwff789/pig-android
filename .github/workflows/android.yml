name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      # The relay ships with every release; catch a broken build (or a failing
      # history/page test) on the PR instead of at tag time.
      - name: "Relay: vet, test, cross-compile"
        run: |
          cd relay
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/pig-relay-android-arm64" .

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pig-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease -PversionCode=100 -PversionName=1.0.0 --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pig-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
